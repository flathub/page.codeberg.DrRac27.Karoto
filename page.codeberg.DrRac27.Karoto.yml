app-id: page.codeberg.DrRac27.Karoto
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.10"
command: karoto
rename-icon: karoto
rename-desktop-file: karoto.desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - name: karoto
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=${FLATPAK_DEST} karoto-*.whl
      - install -Dm644 packaging/karoto.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm644 packaging/karoto.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 packaging/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/03/2d/8b8f81ed623fc136218da2944e58318cb397af36090d35d0be4d24e6ec6b/karoto-0.2-py3-none-any.whl
        sha256: 27da2127a55e0750d0a6ee02842d03a8fd7e6868216104906567af0e52b63531
      - type: git
        url: https://codeberg.org/DrRac27/karoto.git
        commit: 58e96e8865706c941fed74e46457e589d0a0f5d8
